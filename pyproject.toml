[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phonebridge"
version = "0.0.2"
description = "Standalone Bluetooth telephony bridge service (oFono/PipeWire over D-Bus) with a JSON-RPC + PCM agent API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phonebridge"]

[tool.pytest.ini_options]
markers = ["e2e: live tests requiring real Bluetooth/telephony hardware"]
timeout = 60

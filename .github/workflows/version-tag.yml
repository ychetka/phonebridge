name: version-tag

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a queued/running run on main: this job is the
# version-tag drift guard, so a later push must not silently skip the
# check for an earlier merge (that is exactly the incident it exists
# to catch). Runs queue per ref and each one completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Assert pyproject version has a release tag
        # Round 33 (audit finding 20): the check is pinned to the
        # commit this run was triggered for - a later merge landing
        # on main while an earlier run still polls must not
        # invalidate it, so the tag is verified against THIS sha and
        # the pyproject version read from the tagged commit.
        env:
          VERSION_TAG_EXPECT_SHA: ${{ github.sha }}
        run: bash tools/check_version_tag.sh 600
